name: Liga Portugal weekly to Discord

on:
  push:
    branches: [main]
    paths: ["data/portugal/20*.json"]
  workflow_dispatch:

concurrency:
  group: portugal-weekly
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: cd scripts && python portugal.py send
